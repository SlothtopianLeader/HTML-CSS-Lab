<!DOCTYPE html>
<html>
<head>
<title>Sign Up</title>
</head>
<style>
h1 {text-align: center; padding-top: 3.5em;}
div.dialog {
    
    border: 2px double black;
    background: #e8edf8;
    padding-top: 0em;
    padding-left: 1em;
    padding-right: 1em;
    padding-bottom: 1em;

    /* center the div vertically and horizontally
       ref: https://stackoverflow.com/a/13356401 */
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    margin: auto;

    /* set size of dialog */
    width: 40vw;
    height: 40vh;

    overflow: auto;

    /* offset x, offset y, blur radius, color*/
    box-shadow: 1em 1em 0.5em rgba(0,0,0,0.5);

    z-index: 10;
}

.title {
    font-weight: bold;
    text-align: center;
    margin-bottom: 1em;
    color: black;
    padding: 0.5em;
}

.alert
{
    position: fixed;
    left: 0;
    top: 0;
    background: #ffcccc;
    text-align: center;
    width: 100%;
    padding: 1em;
    box-shadow: 0em 1em 1em rgba(0,0,0,0.5);
    border-top: 2px solid red;
    border-bottom: 2px solid red;
}


div.button {
    border: 3px outset;
    margin: 1em;
    padding: 1em;
    background: #66a9c0;
    text-align: center;
}

.error{
   color: red;
   font-size: 0.9em; 
}

</style>
<h1>Sign Up</h1>
<body style="background-color:#a6b7df;">
<div class="dialog">
    <br>
    <br>
    <div>Email</div>
    <input id="email" size=10>

    <div>Real Name</div>
    <input id="name" size=10>

    <div>Password</div>
    <input id="password" type="password" size=10>

    <div>Date of Birth</div>
    <input id="dob" type="date">

    <br>
    <br>
    <hr>
    <br>
    <br>
    <button onclick="SignUp()">Sign Up</button>

</div>

<script src="/html/signup.js"></script>
</body>
</html>
