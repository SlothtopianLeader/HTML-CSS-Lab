<!DOCTYPE html>
<html>
<head>
<title>Sign Up</title>
</head>
<style>
h1 {text-align: center; padding-top: 3.5em;}
div.dialog {
    
    border: 2px double black;
    background: #e8edf8;
    padding-top: 0em;
    padding-left: 1em;
    padding-right: 1em;
    padding-bottom: 1em;

    /* center the div vertically and horizontally
       ref: https://stackoverflow.com/a/13356401 */
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    margin: auto;

    /* set size of dialog */
    width: 40vw;
    height: 40vh;

    overflow: auto;

    /* offset x, offset y, blur radius, color*/
    box-shadow: 1em 1em 0.5em rgba(0,0,0,0.5);

    z-index: 10;
}

.title {
    font-weight: bold;
    text-align: center;
    margin-bottom: 1em;
    color: black;
    padding: 0.5em;
}

.alert
{
    position: fixed;
    left: 0;
    top: 0;
    background: #ffcccc;
    text-align: center;
    width: 100%;
    padding: 1em;
    box-shadow: 0em 1em 1em rgba(0,0,0,0.5);
    border-top: 2px solid red;
    border-bottom: 2px solid red;
}

.signIn
{
    position: fixed;
    left: 0;
    top: 0;
    background: #ccffd4;
    text-align: center;
    width: 100%;
    padding: 1em;
    box-shadow: 0em 1em 1em rgba(0,0,0,0.5);
    border-top: 2px solid green;
    border-bottom: 2px solid green;
}


div.button {
    border: 3px outset;
    margin: 1em;
    padding: 1em;
    background: #66a9c0;
    text-align: center;
}

</style>
<h1>Sign Up</h1>
<body style="background-color:#a6b7df;">
<div class="dialog">
    <br>
    <br>
    <div>Email</div>
    <input id="email" size=10>

    <div>Real Name</div>
    <input id="name" size=10>

    <div>Password</div>
    <input id="password" type="password" size=10>

    <div>Date of Birth</div>
    <input id="dob" type="date">

    <br>
    <br>
    <hr>
    <br>
    <br>
    <button onclick="SignUp()">Sign Up</button>

</div>

<script>
    function SignUp()
    {
        "use strict";

        let email = document.getElementById("email");
        let emailX = email.value;
        let name = document.getElementById("name");
        let nameX = name.value;
        let password = document.getElementById("password");
        let passwordX = password.value;
        let dob = document.getElementById("dob");
        let dobX = dob.value;

        let hasError = false;

        let tmp = document.createElement("div");
        tmp.classList.add("alert");
        document.body.appendChild(tmp);

        let Newtmp = document.createElement("div");
        Newtmp.classList.add("signIn");
        document.body.appendChild(Newtmp);
        
        if (emailX === "")
        {
            Newtmp.remove();
            tmp.appendChild(document.createTextNode("Email is required. "));
            hasError = true;
        }
        /*
        reference: https://www.geeksforgeeks.org/applications-of-string-indexof-method-in-java/
        */
        else
        {
            let atIndex = emailX.indexOf("@");
            let lastIndex = emailX.lastIndexOf("@");

            if (atIndex === -1)
            {
                Newtmp.remove();
                tmp.appendChild(document.createTextNode("Email must contain '@'. "));
                hasError = true;
            }
            else if (atIndex === 0)
            {
                Newtmp.remove();
                tmp.appendChild(document.createTextNode("Email cannot start with '@'. "));
                hasError = true;
            }
            else if (atIndex === emailX.length - 1)
            {
                Newtmp.remove();
                tmp.appendChild(document.createTextNode("Email cannot end with '@'. "));
                hasError = true;
            }
            else if (atIndex !== lastIndex)
            {
                Newtmp.remove();
                tmp.appendChild(document.createTextNode("Email can only contain one '@'. "));
                hasError = true;
            }
        }

        if (nameX === "")
        {
            Newtmp.remove();
            tmp.appendChild(document.createTextNode("Name is required. "));
            hasError = true;
        }

        if (passwordX === "")
        {
            Newtmp.remove();
            tmp.appendChild(document.createTextNode("Password is required. "));
            hasError = true;
        }

        if (dobX.value === "")
        {
            Newtmp.remove();
            tmp.appendChild(document.createTextNode("Date of Birth is required. "));
            hasError = true;
        }
        else
        {
            let birthDate = new Date(dobX);
            let ageMilliseconds = Date.now() - birthDate.getTime();
            let ageYears = ageMilliseconds / (1000 * 60 * 60 * 24 * 365.25);

            if (ageYears < 13)
            {
                Newtmp.remove();
                tmp.appendChild(document.createTextNode("You must be at least 13 years old to sign up. "));
                hasError = true;
            }
        }

        if (!hasError)
        {
            tmp.remove();
            Newtmp.appendChild(document.createTextNode("Welcome!"));
        }
    };
</script> 

</body>
</html>
